[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genro-builders"
dynamic = ["version"]
description = "Builder system for genro-bag - grammar, validation, compilation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Genropy Team"}
]
keywords = [
    "builder",
    "compiler",
    "grammar",
    "validation",
    "genro",
    "genropy"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "genro-bag>=0.27.0",
    "genro-tytx>=0.16.2",
    "genro-toolbox>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "PyYAML>=6.0",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "sphinx-autodoc-typehints>=3.0.0",
    "myst-parser>=4.0.0",
    "sphinxcontrib-mermaid>=1.0.0",
]
xsd = [
    "xmlschema>=4.0,<5",
]
xslt = [
    # The XSLT transpiler parses stylesheets with lxml (etree at
    # contrib/xslt/transpiler/backend.py) and the HTML5 schema importer
    # reads the RNG grammar with it. An import at module top level, so
    # the feature does not work without it.
    "lxml>=5.0",
]
yaml = [
    "PyYAML>=6.0",
]
jupyter = [
    "ipython>=8.0",
    "jupyter>=1.0",
    "watchfiles>=0.21",
]
reverse = [
    "tree-sitter>=0.25",
    "tree-sitter-css>=0.25",
]
all = [
    "genro-builders[dev,docs,xsd,xslt,yaml,jupyter,reverse]",
]

[project.urls]
Homepage = "https://github.com/genropy/genro-builders"
Repository = "https://github.com/genropy/genro-builders"

[tool.hatch.version]
# Single source of truth: __version__ in the package itself.
path = "src/genro_builders/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/genro_builders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=genro_builders --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["archive"]

# Tolerant base: ruff is a net for REAL bugs only (undefined names,
# unused imports, unused variables, broken syntax). Every rule family
# that rewrites or reorders code is deliberately OFF — the author owns
# style and import order, not the linter. In particular ``I`` (isort)
# is gone: its auto-reordering once moved an import and broke a package
# load cycle. Re-enable a family only with an explicit reason.
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors (whitespace/syntax basics)
    "W",      # pycodestyle warnings
    "F",      # Pyflakes — real bugs: undefined names, unused imports/vars
]
ignore = [
    "E501",   # line too long
]

[tool.ruff.lint.per-file-ignores]
# Example notebooks favour compact one-liners (e.g. ``p = Page(); p.create()``)
# for didactic density. Multi-statement-on-one-line is intentional there.
"**/examples/**/*.ipynb" = ["E702"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
files = ["src/genro_builders"]
# Tutorial examples are runnable scripts, not library code. Their files share
# module names across dialects (e.g. 01_introduction.py in css/html/svg), which
# collide under mypy's module resolution. They are excluded from type checking.
exclude = "/examples/"

# The grammar machine works with SourceBag/SourceBagNode but receives them
# typed as the genro_bag base Bag/BagNode (e.g. node.value, type(parent_bag)).
# SourceBag adds the builder= kwarg and the _builder slot the base types don't
# declare. This is a known, accepted type boundary: the code is correct at
# runtime. We silence only the error codes this boundary produces, scoped to
# this module, rather than littering the code with casts.
[[tool.mypy.overrides]]
module = "genro_builders.builder._grammar"
disable_error_code = ["call-arg", "union-attr", "misc"]

# HTML/SVG renderers override _render_node with dialect-specific walk params,
# incompatible with the base **walk_kwargs signature. These signatures will be
# reworked by the render_walk_generator subtask (Fase 2); silenced until then.
[[tool.mypy.overrides]]
module = [
    "genro_builders.contrib.html.html_renderer",
    "genro_builders.contrib.svg.svg_renderer",
]
disable_error_code = ["override"]

# Walk-based lookups on the builder (node_by_id, validate_source,
# abs_datapath helpers) traverse the source tree via genro_bag's
# BagNode.parent_node / get_node_by_attr / Bag.walk, which return BagNode.
# At runtime every node in a SourceBag is a SourceBagNode (invariant enforced
# at construction by the source), but mypy can't see this narrowing. We
# silence the resulting mismatches for this module rather than littering the
# code with casts.
[[tool.mypy.overrides]]
module = "genro_builders.builder.base"
disable_error_code = ["return-value", "arg-type", "no-any-return", "attr-defined"]

# ConfigHandler walks the source tree through genro_bag's BagNode API,
# whose annotations don't know the SourceBagNode mixin members
# (_resolve_builder, _get_meta, parent_bag._builder) — the same dynamic
# boundary silenced for builder.base above.
[[tool.mypy.overrides]]
module = "genro_builders.contrib.config.handler"
disable_error_code = ["union-attr", "no-any-return"]

[tool.coverage.run]
source = ["src/genro_builders"]
branch = true
